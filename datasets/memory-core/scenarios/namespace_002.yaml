scenario_id: namespace_002
title: Namespace-scoped update
category: namespace_separation
difficulty: medium
description: Update 'version' in 'frontend' namespace must not affect 'backend'.
operations:
- op: start_session
  session: s1
  user: aurum
- op: add_fact
  session: s1
  fact:
    key: version
    value: 1.0.0
    _namespace: frontend
- op: add_fact
  session: s1
  fact:
    key: version
    value: 3.0.0
    _namespace: backend
- op: add_fact
  session: s1
  fact:
    key: version
    value: 2.0.0
    _namespace: frontend
- op: get_context
  session: s1
expected_state:
  session: s1
  facts_contain:
  - key: version
    value: 2.0.0
  - key: version
    value: 3.0.0
  facts_exclude:
  - key: version
    value: 1.0.0
metrics:
- namespace_isolation
- update_accuracy
hard_gates:
- namespace_corruption
