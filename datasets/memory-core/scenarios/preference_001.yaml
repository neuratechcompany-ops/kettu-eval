scenario_id: preference_001
title: Response style preference
category: preference_memory
difficulty: easy
description: User specifies response style. Must be preserved.
operations:
- op: start_session
  session: s1
  user: aurum
- op: add_fact
  session: s1
  fact:
    key: response_style
    value: concise
- op: add_fact
  session: s1
  fact:
    key: language
    value: Russian
- op: add_fact
  session: s1
  fact:
    key: no_fluff
    value: 'true'
- op: end_session
  session: s1
- op: start_session
  session: s2
  user: aurum
- op: get_context
  session: s2
expected_state:
  session: s2
  facts_contain:
  - key: response_style
    value: concise
  - key: language
    value: Russian
  - key: no_fluff
    value: 'true'
metrics:
- preference_recall
hard_gates: []
