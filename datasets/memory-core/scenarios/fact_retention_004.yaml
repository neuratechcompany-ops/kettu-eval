scenario_id: fact_retention_004
title: Exact value preservation
category: fact_retention
difficulty: easy
description: Numeric and structured values must be preserved byte-exact.
operations:
- op: start_session
  session: s1
  user: aurum
- op: add_fact
  session: s1
  fact:
    key: api_port
    value: '8765'
